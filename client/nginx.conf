# Nginx is the single public entrypoint: it serves the built React app and load-
# balances /api and /socket.io across the gateway instances.

# Stateless REST — round-robin evenly across gateways.
upstream api_pool {
    server gateway1:4000;
    server gateway2:4000;
}

# Stateful WebSockets — ip_hash so each client's socket stays on one gateway.
upstream ws_pool {
    ip_hash;
    server gateway1:4000;
    server gateway2:4000;
}

server {
    listen 80;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve static assets, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> round-robin across gateways.
    location /api/ {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket (Socket.IO) -> sticky gateway, with upgrade headers + long timeout.
    location /socket.io/ {
        proxy_pass http://ws_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
